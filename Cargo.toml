[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Bible self-host service "

[workspace]
resolver = "3"
members = [
    "crates/common",
    "crates/db",
    "crates/setup",
    "services/provider",
    "services/setup",
    "services/translate",
]

[workspace.dependencies]
parking_lot = { version = "0.12", features = ["send_guard"] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "http2",
    "blocking",
    "rustls-tls",
    "system-proxy",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "tracing"] }
